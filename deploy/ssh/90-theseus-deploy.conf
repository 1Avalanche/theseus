# Match заканчивается явно: файл включается из sshd_config.
Match User deploy
    AuthorizedKeysFile /etc/ssh/theseus/authorized_keys
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    DisableForwarding yes
    PermitTunnel no
    PermitUserRC no
Match all
