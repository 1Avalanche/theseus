# Тексты core. Кодировка UTF-8. Подстановки — {имя}.
# notification.* — уведомления пользователю, в голосе Сири (без эмодзи, коротко).
# error.* — сообщения об ошибках для модели (MCP): что не так и что можно сделать.

notification.reminder=Напоминаю: {text}
notification.reminder.late=Напоминаю с опозданием — должен был в {time}: {text}

error.invalid_arguments=Аргументы не прошли проверку. Исправь вызов по схеме инструмента.
error.invalid_time=Время записано неверно. Уточни час и минуты в формате HH:MM; не исправляй молча.
error.invalid_date=Такой даты не существует или она записана неверно. Уточни дату; не заменяй её соседним днём.
error.invalid_when=Противоречивое время: нужно date и/или time, либо after (after с часами/минутами — без date и time; after и date вместе нельзя).
error.time_in_past=Время {at_local} уже прошло, сейчас {now_local}. Уточни у пользователя, какое время он имел в виду.
error.too_far=Нельзя ставить напоминание дальше чем на {max_years} лет вперёд.
error.invalid_recurrence=Повторение не прошло проверку. Допустимы daily, weekly, monthly, yearly; COUNT и UNTIL вместе запрещены. Уточни расписание.
error.not_found=Такого напоминания нет.
error.user_inactive=Пользователь не найден или не активен.
error.internal=Внутренняя ошибка сервиса. Сообщи пользователю, что не получилось, и предложи повторить позже.
error.not_recurring=Эта операция доступна только для серии.
error.occurrence_not_found=Такого будущего срабатывания серии нет. Получи актуальную карточку.
error.invalid_state=Сейчас это действие недоступно для напоминания.
error.unsupported_state=Состояние напоминания не поддерживается этой версией. Данные сохранены без изменений.
error.confirmation_required=Нужна карточка и подтверждение кнопкой. Код агента подготовит её.
error.confirmation_stale=Карточка устарела. Получи актуальные данные и запроси новое подтверждение.
error.idempotency_conflict=Ключ операции уже использован для другого запроса. Повторять изменение с новым ключом автоматически нельзя.

snooze.15m=+15 минут
snooze.1h=+1 час
snooze.tmr=Завтра
