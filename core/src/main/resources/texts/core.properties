# Тексты core. Кодировка UTF-8. Подстановки — {имя}.
# notification.* — уведомления пользователю, в голосе Сири (без эмодзи, коротко).
# error.* — сообщения об ошибках для модели (MCP): что не так и что можно сделать.

notification.reminder=Напоминаю: {text}
notification.reminder.late=Напоминаю с опозданием — должен был в {time}: {text}

error.invalid_arguments=Аргументы не прошли проверку ({field}). Исправь вызов по схеме инструмента.
error.invalid_when=Противоречивое время: нужно date и/или time, либо after (after с часами/минутами — без date и time; after и date вместе нельзя).
error.time_in_past=Время {at_local} уже прошло, сейчас {now_local}. Уточни у пользователя, какое время он имел в виду.
error.too_far=Нельзя ставить напоминание дальше чем на {max_years} лет вперёд.
error.invalid_recurrence=Повторяющиеся напоминания пока не поддерживаются: можно поставить только разовое. Скажи об этом пользователю.
error.not_found=Такого напоминания нет.
error.user_inactive=Пользователь не найден или не активен.
error.internal=Внутренняя ошибка сервиса. Сообщи пользователю, что не получилось, и предложи повторить позже.
