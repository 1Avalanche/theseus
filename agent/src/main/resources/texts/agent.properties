reply.welcome=Привет. Я Сири, твой секретарь в Telegram. Умею создавать разовые напоминания и серии с повторами. Например: «напомни через 5 минут проверить болтунов».
reply.welcome_named=Привет, {name}. Я Сири, твой секретарь в Telegram. Умею создавать разовые напоминания и серии с повторами. Например: «напомни через 5 минут проверить болтунов».
reply.about=Я Сири, твой личный секретарь в Telegram. Я ИИ-ассистент. Занимаюсь напоминаниями: разовыми и повторяющимися.
reply.capabilities=Могу создавать разовые и повторяющиеся напоминания, показывать, находить, менять и удалять их. Можно отложить напоминание, пропустить срабатывание или приостановить серию. Напиши, что и когда напомнить.
reply.clarify=Что и когда напомнить? Уточни недостающую часть.
reply.unsupported=Календарь и список дел пока не подключены. Сейчас я занимаюсь напоминаниями.
reply.unsupported_recurrence=Повторы каждые несколько минут или часов пока не поддерживаю. Могу напоминать раз в день или реже.
reply.choose_reminder=Нашёл несколько возможных целей. Укажи нужное напоминание: номер последнего списка, время или ID. Пока ничего не менял.
reply.missing_time=На какое время поставить?
reply.error.invalid_date=Такой даты не существует или она записана неверно. Укажи корректную дату.
reply.error.not_found=Не нашёл такое напоминание. Проверь название или ID.
reply.error.occurrence_not_found=На выбранное время срабатывания нет. Проверь дату и расписание серии.
reply.error.not_recurring=Это разовое напоминание. Пауза и пропуск срабатывания доступны для серии.
reply.error.unsupported_state=Не могу изменить это напоминание в текущей версии. Данные сохранены.
reply.deleted_all=Удалил все текущие напоминания: {count}.
