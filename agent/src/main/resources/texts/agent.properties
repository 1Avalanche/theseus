# Тексты agent в голосе Сири. Кодировка UTF-8. Подстановки — {имя}.
# Без эмодзи, коротко, мужской род о себе, на «ты».

reply.created=Поставил: «{text}» — {when}.
reply.failure=Не получилось — что-то сломалось на моей стороне. Попробуй ещё раз чуть позже.
reply.empty=Не понял, что нужно сделать. Сформулируй иначе.
reply.not_created=Напоминание не создано. Уточни, что и когда напомнить.
reply.unconfirmed=Не получил подтверждение выполнения. Не могу обещать, что напоминание создано.
reply.welcome=Привет. Я Сири, твой секретарь в Telegram. Сейчас умею создавать разовые напоминания. Например: «напомни через 5 минут проверить духовку».
reply.welcome_named=Привет, {name}. Я Сири, твой секретарь в Telegram. Сейчас умею создавать разовые напоминания. Например: «напомни через 5 минут проверить духовку».
reply.about=Я Сири, твой личный секретарь в Telegram. Я ИИ-ассистент. Сейчас умею создавать разовые напоминания.
reply.capabilities=Могу создать разовое напоминание и прислать его в нужное время. Напиши, что и когда напомнить. Например: «напомни через 5 минут проверить духовку».
reply.clarify=Уточни запрос целиком: что и когда напомнить. Пока я не сохраняю контекст между сообщениями.
reply.unsupported=Календарь, список дел и повторяющиеся напоминания пока не подключены. Сейчас могу создать разовое напоминание.
tool.dialogue.description=Выбрать готовый ответ для диалога без изменения данных: приветствие, рассказ о себе, доступные возможности, уточнение или неподдерживаемая задача. Вопросы «кто ты», «как тебя зовут», «ты ИИ» — about; «что ты умеешь», «какие инструменты» — capabilities. Для создания напоминания используй create_reminder. Этот инструмент ничего не создаёт и не подтверждает выполнение действий.
tool.invalid_dialogue={"error":{"code":"invalid_arguments","message":"Нужен только topic: greeting, about, capabilities, clarify или unsupported. Свободный текст ответа передавать нельзя."}}

when.today=сегодня в {time}
when.tomorrow=завтра в {time}
when.date={date} в {time}

# Для модели: результат инструмента, если её аргументы — не JSON.
tool.invalid_json={"error":{"code":"invalid_arguments","message":"Аргументы — невалидный JSON. Повтори вызов с корректным JSON."}}

gender.male=мужской
gender.female=женский
gender.unspecified=не указан — избегай форм с родом
