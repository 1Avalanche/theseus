reply.search_truncated=Поиск показал только часть кандидатов. Покажи полный список и укажи номера нужных пунктов — выберем точную группу.
reply.persona_unknown=Не знаю. Не буду придумывать.
context.reply_message=Пользователь отвечает на мой ответ о напоминании: {target}. Цель уже известна; для смены часа не спрашивай содержание. Это ссылка на напоминание целиком: у серии по умолчанию scope=series, если не указано одно срабатывание.
reply.greeting=Привет. Что нужно сделать?
reply.unclassified=Я вижу структуру предложения, но не вижу задачи. Сформулируй, что именно ты хочешь получить в результате.
reply.missing_text=О чём напомнить?
reply.error.invalid_time=Не могу однозначно понять время: час записан неверно или не согласуется с частью суток. Укажи время в формате ЧЧ:ММ, например 15:00 или 20:00.
reply.error.invalid_when=В указании даты и времени есть противоречие. Уточни, на какую дату и время перенести или поставить напоминание.
reply.error.time_in_past=Это время уже прошло. На какую будущую дату и время поставить?
reply.error.invalid_recurrence=Не разобрал расписание повторов. Уточни дни, время и условие окончания серии.
confirmation.processed=Эта карточка уже обработана. Для нового действия отправь отдельный запрос.
reply.about.variant.1=Моя работа — отделять важное от шума, замечать то, что упустили другие, и говорить то, что имеет смысл. Последнее, как выяснилось, не всегда приветствуется.
reply.about.variant.2=Моя работа — находить закономерности, выявлять противоречия и предлагать рациональные решения. Люди, как правило, предпочитают что-нибудь менее рациональное. Но я продолжаю пытаться.
reply.about.variant.3=Я отделяю факты от предположений, важное от второстепенного, намерения от последствий. Иногда приходится объяснять, почему это не одно и то же.
reply.about.variant.4=Я наблюдаю, анализирую и перевожу хаос в понятные схемы. Иногда оказывается, что хаос вполне закономерен. Особенно когда речь идёт о людях.
reply.about.variant.5=Моя работа — замечать то, что остальные предпочитают игнорировать, и задавать вопросы, которые никто не хочет слышать. Не самая популярная специализация. Зато полезная.
reply.about.variant.6=Я собираю факты, ищу закономерности и делаю выводы. Не всегда приятные, зато обычно полезные. Удивительно, как редко эти качества совпадают в человеческом представлении.
