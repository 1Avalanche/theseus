# Проверка на push и PR: сборка, юнит- и интеграционные тесты (Testcontainers), ktlint, detekt.
# Только проверка — не деплой (DECISIONS.md §12).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Сборка и тесты
        run: |
          python3 -m unittest discover -s deploy/handler/tests -v
          ./gradlew build
      - name: Ограничения SSH и sudo в Ubuntu
        run: |
          docker build -f deploy/handler/tests/Dockerfile -t theseus-deploy-check .
          docker run --rm --network none theseus-deploy-check
      - name: Отчёты тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
            **/build/reports/ktlint/
          retention-days: 7
