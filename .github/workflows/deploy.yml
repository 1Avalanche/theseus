# Ручной деплой на стенд (DECISIONS.md §12). Запуск: Actions → Deploy → Run workflow.
# ref → SHA → образы ghcr.io/<owner>/theseus-{core,agent}:<sha> (собираются, только если их нет) →
# SSH на VPS: deploy.sh (дамп БД → pull → up -d → ожидание healthy).
# Продвижение, а не пересборка: test и prod из одного SHA получают один и тот же образ.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stand:
        description: Стенд
        type: choice
        options: [test, prod]
        default: test
      ref:
        description: Ветка, тег или SHA (prod — только коммиты из main)
        type: string
        default: main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.stand }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      registry: ${{ steps.resolve.outputs.registry }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: SHA и реестр
        id: resolve
        env:
          REF: ${{ inputs.ref }}
          STAND: ${{ inputs.stand }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "Деплой $REF → $sha на $STAND"
      - name: prod — только из main
        if: inputs.stand == 'prod'
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.resolve.outputs.sha }}" origin/main \
            || { echo "::error::Коммит не входит в main — на prod нельзя"; exit 1; }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Есть ли образы
        id: exists
        run: |
          for module in core agent; do
            if ! docker manifest inspect "${{ steps.resolve.outputs.registry }}/theseus-$module:${{ steps.resolve.outputs.sha }}" > /dev/null 2>&1; then
              echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "Образы уже в реестре — продвигаем без пересборки"
      - uses: actions/setup-java@v5
        if: steps.exists.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
        if: steps.exists.outputs.build == 'true'
      - name: Сборка, тесты, дистрибутивы
        if: steps.exists.outputs.build == 'true'
        run: ./gradlew build installDist
      - name: Образы → ghcr.io
        if: steps.exists.outputs.build == 'true'
        run: |
          for module in core agent; do
            image="${{ steps.resolve.outputs.registry }}/theseus-$module:${{ steps.resolve.outputs.sha }}"
            docker build -f deploy/Dockerfile --build-arg MODULE="$module" \
              --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
              --label org.opencontainers.image.revision="${{ steps.resolve.outputs.sha }}" \
              -t "$image" .
            docker push "$image"
          done

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Секреты VPS — в GitHub Environment стенда: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
    environment: ${{ inputs.stand }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.image.outputs.sha }}
      - name: SSH-ключ
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Файлы деплоя → VPS
        run: |
          chmod +x deploy/vps/deploy.sh deploy/vps/infra/initdb/*.sh
          scp -i ~/.ssh/id_deploy -r deploy/vps/. "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/theseus/"
      - name: Деплой
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Токен GitHub живёт только на время job: логин в ghcr на VPS — на один деплой.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin > /dev/null \
             && trap 'docker logout ghcr.io > /dev/null' EXIT \
             && /opt/theseus/deploy.sh '${{ inputs.stand }}' '${{ needs.image.outputs.sha }}'"
