# Только запрос ограниченному обработчику; файлы и секреты приложения не копируются.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      stand:
        description: Стенд
        type: choice
        options: [test, prod]
        default: test
      action:
        description: Операция (stop разрешён только для test)
        type: choice
        options: [deploy, stop]
        default: deploy
      release:
        description: Полный SHA разрешённого на VPS релиза (для stop оставить пустым)
        type: string
        default: ''

permissions: {}

concurrency:
  group: deploy-${{ inputs.stand }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == '1Avalanche/theseus' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.stand }}
    steps:
      - name: Запрос и SSH-доступ
        env:
          STAND: ${{ inputs.stand }}
          ACTION: ${{ inputs.action }}
          RELEASE: ${{ inputs.release }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, re
          stand, action, release = (os.environ[k] for k in ('STAND', 'ACTION', 'RELEASE'))
          assert stand in ('test', 'prod'), 'Неизвестный стенд'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', os.environ['VPS_HOST']), 'Некорректный VPS_HOST'
          assert os.environ['VPS_USER'] == 'deploy', 'Ожидался ограниченный пользователь deploy'
          if action == 'deploy':
              assert re.fullmatch(r'[0-9a-f]{40}', release), 'Нужен полный SHA релиза'
              request = {'action': action, 'release': release}
          else:
              assert action == 'stop' and stand == 'test' and not release, 'Разрешён только stop test без SHA'
              request = {'action': 'stop'}
          pathlib.Path('request.json').write_text(json.dumps(request) + '\n')
          ssh = pathlib.Path.home() / '.ssh'
          ssh.mkdir(mode=0o700, exist_ok=True)
          (ssh / 'id_deploy').write_text(os.environ['VPS_SSH_KEY'] + '\n')
          (ssh / 'known_hosts').write_text(os.environ['VPS_KNOWN_HOSTS'] + '\n')
          PY
          ssh -T -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" < request.json
