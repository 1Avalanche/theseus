# Кандидат не разрешает запуск: владелец одобряет его через Authorize release.
name: Build release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка, тег или SHA для сборки
        type: string
        default: main

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == '1Avalanche/theseus' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Проверки и дистрибутивы
        run: |
          python3 -m unittest discover -s deploy/handler/tests -v
          ./gradlew build installDist
          docker build -f deploy/handler/tests/Dockerfile -t theseus-deploy-check .
          docker run --rm --network none theseus-deploy-check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Образы и кандидат разрешения
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for module in core agent; do
            docker buildx build --push --platform linux/amd64 -f deploy/Dockerfile \
              --build-arg MODULE="$module" \
              --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
              --label org.opencontainers.image.revision="$sha" \
              --metadata-file "$module-metadata.json" \
              -t "$registry/theseus-$module:$sha" .
          done
          python3 - "$sha" <<'PY'
          import json, pathlib, re, sys
          release = {'commit': sys.argv[1], 'config_version': '2'}
          for module in ('core', 'agent'):
              digest = json.loads(pathlib.Path(module + '-metadata.json').read_text())['containerimage.digest']
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
              release[module + '_digest'] = digest
          pathlib.Path('release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
          echo "Кандидат готов. Authorize release: build_run_id=$GITHUB_RUN_ID. Деплой запускается отдельно." >> "$GITHUB_STEP_SUMMARY"
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: release.json
          retention-days: 30
